<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#04070b">
<meta name="csrf" content="{{ csrf }}">
<meta name="base" content="{{ u('') }}">
<title>Line Monitor</title>
<link rel="icon" href="{{ u('/static/entrance/icon.svg') }}?v={{ V }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ u('/static/app/app.css') }}?v={{ V }}">
<script type="module" src="{{ u('/static/app/main.js') }}?v={{ V }}"></script>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="{{ u('/') }}" data-nav>
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 21c4 0 5-10 9-10s4 8 7 8 4-6 9-6"/></svg>
      <span>Line Monitor</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="{{ u('/') }}" data-nav data-tab="live">Live</a>
      <a href="{{ u('/evidence') }}" data-nav data-tab="evidence">Evidence</a>
      <a href="{{ u('/compare') }}" data-nav data-tab="compare">Compare</a>
      <a href="{{ u('/explorer') }}" data-nav data-tab="explorer">Explorer</a>
      <a href="{{ u('/export') }}" data-nav data-tab="export">Export</a>
      <a href="{{ u('/annotations') }}" data-nav data-tab="annotations">Notes</a>
      <a href="{{ u('/settings') }}" data-nav data-tab="settings">Settings</a>
    </nav>
    <div class="status" id="status" aria-live="polite"></div>
    <form method="post" action="{{ u('/leave') }}" class="leave"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button title="Sign out" aria-label="Sign out">⏻</button></form>
  </header>
  {% if synthetic %}<div class="synthetic">SYNTHETIC DATA: development database, not real measurements</div>{% endif %}
  <main id="view" tabindex="-1"></main>
  <footer class="foot">speedmon {{ VERSION }} · times shown in your configured time zone · raw records are immutable</footer>
</div>
<div id="drawer" class="drawer" hidden></div>
<div id="tip" class="tip" hidden></div>
</body>
</html>
