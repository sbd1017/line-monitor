# /speedtest behind https://example.com/speedtest/ - http{} context.
# Install as /etc/nginx/conf.d/20-site-speedtest.conf (source of truth: deploy/nginx/ in the speedtest project).
# Requests made on the Pi itself ($site_private_app_ok = 1) are not counted.
map $site_private_app_ok $site_speedtest_key {
    1       "";
    default $binary_remote_addr;
}
map $request_method $site_speedtest_read_key {
    default "";
    GET     $site_speedtest_key;
    HEAD    $site_speedtest_key;
}
map $request_method $site_speedtest_write_key {
    default $site_speedtest_key;
    GET     "";
    HEAD    "";
}
map $request_method $site_speedtest_method_ok {
    default 0;
    GET     1;
    HEAD    1;
    POST    1;
}
# The dashboard polls /api/live every 10 s (1 s while a test runs) and loads ~15 JSON views on open.
limit_req_zone  $site_speedtest_read_key  zone=site_speedtest_read:1m  rate=20r/s;
limit_req_zone  $site_speedtest_write_key zone=site_speedtest_write:1m rate=30r/m;
limit_req_zone  $site_speedtest_write_key zone=site_speedtest_enter:1m rate=6r/m;
limit_conn_zone $site_speedtest_key       zone=site_speedtest_conn:1m;
