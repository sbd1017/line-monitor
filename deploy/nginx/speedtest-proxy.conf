# Proxy settings for each /speedtest location. Install as /etc/nginx/snippets/site-speedtest-proxy.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header Authorization "";               # no credential header ever reaches the app
proxy_set_header X-Real-IP $remote_addr;         # visitor IP for the entrance limiter (trusted from 127.0.0.1 only)
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_redirect off;
proxy_connect_timeout 3s;
# proxy_buffering and the send/read timeouts are set per location (exports override them).
include snippets/site-speedtest-headers.conf;

# Overwrite client identity; only the central auth subrequest supplies these.
include snippets/site-site-identity.conf;
