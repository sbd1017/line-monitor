# /speedtest behind https://example.com/speedtest/ - server{} context of example.com.
# Install as /etc/nginx/snippets/site-speedtest.conf and include it from sites-available/example.com.conf.
# Cloudflare -> cloudflared -> nginx 127.0.0.1:8081 -> here -> speedmon 127.0.0.1:8772 (path kept).
# The app is the gate (phrase entrance, sessions, CSRF). nginx adds limits and refuses the agent API outright:
# the measurement agent talks to 127.0.0.1:8772 directly and never comes through here.

location = /speedtest {
    access_log /var/log/nginx/site-speedtest.access.log site_apps;
    include snippets/site-speedtest-headers.conf;
    return 308 /speedtest/;
}

location ^~ /speedtest/agent/ {
    access_log /var/log/nginx/site-speedtest.access.log site_apps;
    return 404;
}

location ^~ /speedtest/ {
    if ($site_speedtest_method_ok = 0) { return 405; }
    access_log /var/log/nginx/site-speedtest.access.log site_apps;   # path only: never query strings or bodies
    limit_conn site_speedtest_conn 24;
    limit_conn_status 429;
    limit_req zone=site_speedtest_read burst=80 nodelay;
    limit_req zone=site_speedtest_write burst=15 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    proxy_buffering on;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8772;
    include snippets/site-speedtest-proxy.conf;

    location = /speedtest/enter {
        if ($site_speedtest_method_ok = 0) { return 405; }
        access_log /var/log/nginx/site-speedtest.access.log site_apps;
        limit_req zone=site_speedtest_read burst=40 nodelay;
        limit_req zone=site_speedtest_enter burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 2k;
        client_body_buffer_size 2k;
        proxy_pass http://127.0.0.1:8772;
        include snippets/site-speedtest-proxy.conf;
    }

    # Export downloads can be gigabytes: stream them, never spool to nginx temp files, allow slow clients.
    location ^~ /speedtest/exports/ {
        if ($site_speedtest_method_ok = 0) { return 405; }
        access_log /var/log/nginx/site-speedtest.access.log site_apps;
        limit_req zone=site_speedtest_read burst=10 nodelay;
        proxy_pass http://127.0.0.1:8772;
        include snippets/site-speedtest-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
